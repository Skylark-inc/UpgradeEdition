<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Skylark Upgrade</title>

<link rel="icon" href="https://endlesspete.github.io/Medotdev/BBA22EA1-962D-44D9-B632-3E823FF06445.png">
<link rel="apple-touch-icon" href="https://endlesspete.github.io/Medotdev/BBA22EA1-962D-44D9-B632-3E823FF06445.png">

<style>
:root {
  color-scheme: light dark;
  --bg: #f5f5f7;
  --card: rgba(255,255,255,.82);
  --text: #1c1c1e;
  --muted: #6e6e73;
  --border: rgba(0,0,0,.08);
  --accent: #007aff;
  --danger: #ff3b30;
  --warning: #ff9500;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #09090b;
    --card: rgba(28,28,30,.78);
    --text: #f2f2f7;
    --muted: #a1a1aa;
    --border: rgba(255,255,255,.1);
    --accent: #6aa9ff;
    --danger: #ff6961;
    --warning: #ffb340;
  }
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  padding: 22px;
  display: flex;
  align-items: center;
  justify-content: center;
  background:
    radial-gradient(circle at top, rgba(0,122,255,.16), transparent 42%),
    var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", sans-serif;
}

.container {
  width: 100%;
  max-width: 430px;
}

.hero {
  text-align: center;
  margin-bottom: 22px;
}

.hero-title {
  margin: 0;
  font-size: 3rem;
  font-weight: 850;
  letter-spacing: -2px;
  line-height: .95;
  background: linear-gradient(180deg, #007aff, #003e8a);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.hero-subtitle {
  margin-top: 12px;
  color: var(--muted);
  font-size: .98rem;
  line-height: 1.45;
}

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 34px;
  padding: 28px 24px;
  text-align: center;
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  box-shadow: 0 18px 45px rgba(0,0,0,.16);
}

.badge {
  display: inline-flex;
  padding: 7px 14px;
  border-radius: 999px;
  background: rgba(0,122,255,.13);
  color: var(--accent);
  font-size: .78rem;
  font-weight: 800;
  margin-bottom: 18px;
}

.title {
  font-size: 1.7rem;
  font-weight: 850;
  letter-spacing: -.8px;
  line-height: 1.15;
}

.version {
  margin-top: 12px;
  color: var(--muted);
  line-height: 1.45;
}

.button {
  display: block;
  margin-top: 26px;
  width: 100%;
  border-radius: 18px;
  padding: 16px 18px;
  background: var(--accent);
  color: white;
  font-size: 1rem;
  font-weight: 750;
  text-decoration: none;
}

.button.disabled {
  opacity: .45;
  pointer-events: none;
  background: #8e8e93;
}

.refresh {
  margin-top: 12px;
  border: none;
  background: transparent;
  color: var(--accent);
  font-size: .9rem;
  font-weight: 650;
  cursor: pointer;
}

.small {
  margin-top: 16px;
  font-size: .84rem;
  color: var(--muted);
  line-height: 1.5;
}

.small a {
  color: var(--accent);
  text-decoration: none;
  font-weight: 600;
}

.notice {
  margin-top: 16px;
  padding: 13px 14px;
  border-radius: 18px;
  font-size: .86rem;
  font-weight: 650;
  line-height: 1.45;
  display: none;
}

.notice.warning {
  display: block;
  color: #5c3900;
  background: rgba(255,149,0,.16);
}

.notice.danger {
  display: block;
  color: var(--danger);
  background: rgba(255,59,48,.12);
}

@media (prefers-color-scheme: dark) {
  .notice.warning {
    color: #ffd28a;
  }
}

.footer {
  margin-top: 26px;
  text-align: center;
  font-size: .82rem;
  color: var(--muted);
  line-height: 1.8;
}

.footer a {
  color: var(--accent);
  text-decoration: none;
}
</style>
</head>

<body>

<div class="container">
  <div class="hero">
    <h1 class="hero-title">Skylark Upgrade</h1>
    <div class="hero-subtitle">
      Get the Skylark edition built for your device.
    </div>
  </div>

  <div class="card">
    <div class="badge" id="badge">Checking Device</div>
    <div class="title" id="title">Finding your edition...</div>
    <div class="version" id="version">Please wait while Skylark checks compatibility.</div>

    <a id="button" class="button disabled" href="#">Checking</a>
    <button class="refresh" onclick="location.reload()">Check again</button>

    <div class="small" id="small">Loading edition data...</div>
    <div class="notice" id="notice"></div>
  </div>

  <div class="footer">
    <a href="https://x.com/Useskylark" target="_blank">@UseSkylark</a>
    <br>
    <a href="https://x.com/endlesspeteinc" target="_blank">@Endlesspeteinc</a>
  </div>
</div>

<script>
const EDITIONS_URL = "/editions.json";
const UNSUPPORTED_ARTICLE = "https://skylark-inc.github.io/Support/UnsupportedPlatforms/";

const ua = navigator.userAgent;

const isApple =
  /iPhone|iPad|Macintosh/.test(ua) &&
  !/Android|Windows|Linux/.test(ua);

let iosVersion = null;

const osMatch = ua.match(/OS (\d+)[._](\d+)/);
const versionMatch = ua.match(/Version\/(\d+)\.(\d+)/);

if (osMatch) {
  iosVersion = {
    major: Number(osMatch[1]),
    minor: Number(osMatch[2]),
    text: `${osMatch[1]}.${osMatch[2]}`
  };
}

/* iOS 26+ Safari fix */
if (versionMatch && iosVersion) {
  const safariMajor = Number(versionMatch[1]);
  const safariMinor = Number(versionMatch[2]);

  if (safariMajor >= 26 && iosVersion.major <= 18) {
    iosVersion = {
      major: safariMajor,
      minor: safariMinor,
      text: `${safariMajor}.${safariMinor}`
    };
  }
}

const badge = document.getElementById("badge");
const title = document.getElementById("title");
const version = document.getElementById("version");
const button = document.getElementById("button");
const small = document.getElementById("small");
const notice = document.getElementById("notice");

function versionToParts(value) {
  const text = String(value).replace("iOS", "").trim();
  const parts = text.split(".");

  return {
    major: Number(parts[0] || 0),
    minor: Number(parts[1] || 0),
    text
  };
}

function compareVersions(a, b) {
  if (a.major !== b.major) return a.major - b.major;
  return a.minor - b.minor;
}

function editionNumber(item) {
  const name = item.edition || "";
  const match = String(name).match(/\d+/);
  return match ? Number(match[0]) : 0;
}

function getEditionName(item) {
  return item.edition || `Edition ${editionNumber(item)}`;
}

function getEditionVersion(item) {
  return item.version ? ` ${item.version}` : "";
}

function getEditionLink(item) {
  return item.link || "";
}

function getMinVersion(item) {
  return versionToParts(item.min);
}

function getMaxVersion(item) {
  return versionToParts(item.max);
}

function setButton(text, link, disabled = false) {
  button.textContent = text;

  if (disabled || !link) {
    button.classList.add("disabled");
    button.removeAttribute("href");
  } else {
    button.classList.remove("disabled");
    button.href = link;
  }
}

function setNotice(message, type = "warning") {
  notice.textContent = message;
  notice.className = `notice ${type}`;
}

function clearNotice() {
  notice.textContent = "";
  notice.className = "notice";
}

function stopUnsupported(status, heading, subtext, note) {
  badge.textContent = status;
  title.textContent = heading;
  version.textContent = subtext;

  setButton("Learn More", UNSUPPORTED_ARTICLE);

  small.innerHTML = `
    This platform is not supported by Skylark.
  `;

  setNotice(note, "danger");
}

function stopPage(status, heading, subtext, note) {
  badge.textContent = status;
  title.textContent = heading;
  version.textContent = subtext;

  setButton("Check again", "", true);

  small.textContent = "Edition data is not available right now.";
  setNotice(note, "danger");
}

function isDownloadable(item) {
  if (!getEditionLink(item)) return false;
  return true;
}

async function start() {
  clearNotice();

  if (!isApple) {
    stopUnsupported(
      "Unsupported Platform",
      "Skylark is made for Apple devices",
      "Use an iPhone, iPad, or supported Apple device.",
      "Android, Windows, and Linux devices are not supported."
    );
    return;
  }

  if (!iosVersion) {
    stopUnsupported(
      "Version Not Detected",
      "Skylark could not read your iOS version",
      "Open this page in Safari on your Apple device.",
      "Your platform or browser could not be identified."
    );
    return;
  }

  let data;

  try {
    const response = await fetch(EDITIONS_URL, { cache: "no-store" });

    if (!response.ok) {
      throw new Error("Unable to load editions.json");
    }

    data = await response.json();
  } catch (err) {
    stopPage(
      "Edition Data Unavailable",
      "Skylark could not load edition data",
      "Please try again later.",
      "The editions.json file could not be loaded."
    );
    return;
  }

  const editions = Array.isArray(data) ? data : data.editions;

  if (!Array.isArray(editions)) {
    stopPage(
      "Invalid Edition Data",
      "Skylark could not read the edition list",
      "The editions.json file may be formatted incorrectly.",
      "Edition data is missing or invalid."
    );
    return;
  }

  const sortedEditions = editions
    .slice()
    .sort((a, b) => editionNumber(a) - editionNumber(b));

  let supportedEdition = sortedEditions.find(item => {
    const min = getMinVersion(item);
    const max = getMaxVersion(item);

    return (
      compareVersions(iosVersion, min) >= 0 &&
      compareVersions(iosVersion, max) <= 0
    );
  });

  let unconfirmedSameMajor = false;

  if (!supportedEdition) {
    supportedEdition = sortedEditions.find(item => {
      const min = getMinVersion(item);
      const max = getMaxVersion(item);

      return (
        iosVersion.major === max.major &&
        compareVersions(iosVersion, max) > 0 &&
        compareVersions(iosVersion, min) >= 0
      );
    });

    if (supportedEdition) {
      unconfirmedSameMajor = true;
    }
  }

  if (!supportedEdition) {
    stopUnsupported(
      "Not Supported",
      "No Skylark edition is available for this software version",
      `Detected iOS ${iosVersion.text}.`,
      "Your software version does not currently match a supported Skylark edition."
    );
    return;
  }

  const editionName = getEditionName(supportedEdition);
  const editionVersion = getEditionVersion(supportedEdition);
  const editionLink = getEditionLink(supportedEdition);

  badge.textContent = "Recommended Edition";
  title.textContent = `Upgrade to ${editionName}`;
  version.textContent = `This is the Skylark edition built for iOS ${iosVersion.text}.`;

  if (editionLink) {
    setButton(`Get ${editionName}${editionVersion}`, editionLink);
  } else {
    setButton("Download Unavailable", "", true);
    setNotice("No download is currently available for this edition. Try again later.", "danger");
  }

  small.innerHTML = `
    Using the right edition keeps Skylark smoother, cleaner, and better matched to your device.
  `;

  const messages = [];

  if (supportedEdition.beta === true) {
    messages.push(
      `${editionName} is currently in beta. Some features may be unfinished, unstable, or change before release. For the best experience, use the latest software beta available.`
    );
  }

  if (supportedEdition.alert === true && supportedEdition.alertMessage) {
    messages.push(supportedEdition.alertMessage);
  }

  if (unconfirmedSameMajor) {
    messages.push(
      `Your software version is newer than the confirmed range for ${editionName}. The download is available, but compatibility has not yet been confirmed.`
    );
  }

  if (messages.length > 0 && editionLink) {
    setNotice(messages.join(" "), "warning");
  }

  console.log("Detected iOS:", iosVersion.text);
  console.log("Recommended edition:", editionName);
}

start();
</script>

</body>
</html>
