<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Skylark Upgrade</title>

<link rel="icon" type="image/png" sizes="32x32" href="https://endlesspete.github.io/Medotdev/BBA22EA1-962D-44D9-B632-3E823FF06445.png">
<link rel="apple-touch-icon" href="https://endlesspete.github.io/Medotdev/BBA22EA1-962D-44D9-B632-3E823FF06445.png">

<style>
:root {
  color-scheme: light dark;
  --bg: #f5f5f7;
  --card: rgba(255,255,255,.82);
  --text: #1c1c1e;
  --muted: #6e6e73;
  --border: rgba(0,0,0,.08);
  --accent: #007aff;
  --danger: #ff3b30;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #09090b;
    --card: rgba(28,28,30,.78);
    --text: #f2f2f7;
    --muted: #a1a1aa;
    --border: rgba(255,255,255,.1);
    --accent: #6aa9ff;
    --danger: #ff6961;
  }
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  padding: 22px;
  display: flex;
  align-items: center;
  justify-content: center;
  background:
    radial-gradient(circle at top, rgba(0,122,255,.18), transparent 42%),
    var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", sans-serif;
}

.container {
  width: 100%;
  max-width: 430px;
}

.hero {
  text-align: center;
  margin-bottom: 22px;
}

.hero-title {
  margin: 0;
  font-size: 3rem;
  font-weight: 850;
  letter-spacing: -2px;
  line-height: .95;
  background: linear-gradient(180deg, #ffffff, #8dbfff);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

@media (prefers-color-scheme: light) {
  .hero-title {
    background: linear-gradient(180deg, #007aff, #003e8a);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
}

.hero-subtitle {
  margin-top: 12px;
  color: var(--muted);
  font-size: .98rem;
  line-height: 1.45;
}

.card {
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 34px;
  padding: 28px 24px;
  text-align: center;
  box-shadow:
    0 1px 0 rgba(255,255,255,.35) inset,
    0 18px 45px rgba(0,0,0,.16);
}

.badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 7px 14px;
  border-radius: 999px;
  background: rgba(0,122,255,.13);
  color: var(--accent);
  font-size: .78rem;
  font-weight: 800;
  margin-bottom: 18px;
}

.title {
  font-size: 1.75rem;
  font-weight: 850;
  letter-spacing: -.8px;
  line-height: 1.14;
}

.version {
  margin-top: 12px;
  color: var(--muted);
  font-size: 1rem;
  line-height: 1.45;
}

.button {
  display: block;
  margin-top: 26px;
  width: 100%;
  border-radius: 18px;
  padding: 16px 18px;
  background: var(--accent);
  color: white;
  font-size: 1rem;
  font-weight: 750;
  text-decoration: none;
  transition: transform .18s ease, opacity .18s ease;
}

.button:active {
  transform: scale(.97);
}

.button.disabled {
  opacity: .45;
  pointer-events: none;
  user-select: none;
  background: #8e8e93;
}

.small {
  margin-top: 14px;
  font-size: .84rem;
  color: var(--muted);
  line-height: 1.5;
}

.small a {
  color: var(--accent);
  text-decoration: none;
  font-weight: 600;
}

.error {
  margin-top: 18px;
  color: var(--danger);
  font-size: .9rem;
  font-weight: 650;
  line-height: 1.45;
}

.footer {
  margin-top: 26px;
  text-align: center;
  font-size: .82rem;
  color: var(--muted);
  line-height: 1.8;
}

.footer a {
  color: var(--accent);
  text-decoration: none;
}
</style>
</head>

<body>

<div class="container">
  <div class="hero">
    <h1 class="hero-title">Skylark Upgrade</h1>
    <div class="hero-subtitle">
      A smoother Skylark experience starts with the edition made for your device.
    </div>
  </div>

  <div class="card">
    <div class="badge" id="badge">Checking Device</div>

    <div class="title" id="title">Finding your edition...</div>

    <div class="version" id="version">
      Skylark is checking your device compatibility.
    </div>

    <a id="button" class="button" href="#">Checking</a>

    <div class="small" id="small">
      This only takes a moment.
    </div>

    <div class="error" id="error"></div>
  </div>

  <div class="footer">
    <a href="https://x.com/Useskylark" target="_blank">@UseSkylark</a>
    <br>
    <a href="https://x.com/endlesspeteinc" target="_blank">@Endlesspeteinc</a>
  </div>
</div>

<script>
const editions = [
  {
    edition: "Edition 1",
    min: 14.3,
    max: 14.8,
    link: "https://www.icloud.com/shortcuts/0e72496714944ee296007b436b4d3a8f"
  },
  {
    edition: "Edition 2",
    min: 15.0,
    max: 15.8,
    link: "https://www.icloud.com/shortcuts/65a674774ee5475cba87bb8ad822b08a"
  },
  {
    edition: "Edition 3",
    min: 16.0,
    max: 16.7,
    link: "https://www.icloud.com/shortcuts/9c5bd486f48d4448b47bf423616ce882"
  },
  {
    edition: "Edition 4",
    min: 17.0,
    max: 17.7,
    link: "https://www.icloud.com/shortcuts/8753eef694b54d13b29821ee68343e32"
  },
  {
    edition: "Edition 5",
    min: 18.0,
    max: 18.7,
    link: "https://www.icloud.com/shortcuts/1f61f828cbf14f739117c164a4b5584a"
  },
  {
    edition: "Edition 6",
    min: 26.0,
    max: 26.5,
    link: "https://www.icloud.com/shortcuts/6aa7d90451154a98bf080ea9af262c30"
  }
];

const ua = navigator.userAgent;

const isApple =
  /iPhone|iPad|Macintosh/.test(ua) &&
  !/Android|Windows|Linux/.test(ua);

let ios = null;

const osMatch = ua.match(/OS (\d+)[._](\d+)/);
const versionMatch = ua.match(/Version\/(\d+)\.(\d+)/);

if (osMatch) {
  ios = parseFloat(`${osMatch[1]}.${osMatch[2]}`);
}

/* Helps newer Safari/iOS versions report correctly */
if (versionMatch) {
  const safariMajor = parseInt(versionMatch[1]);
  const safariMinor = parseInt(versionMatch[2]);

  if (safariMajor >= 26 && ios && ios <= 18.7) {
    ios = parseFloat(`${safariMajor}.${safariMinor}`);
  }
}

const badge = document.getElementById("badge");
const title = document.getElementById("title");
const version = document.getElementById("version");
const button = document.getElementById("button");
const small = document.getElementById("small");
const error = document.getElementById("error");

function unsupported(status, heading, subtext, buttonText, smallText, errorText) {
  badge.textContent = status;
  title.textContent = heading;
  version.textContent = subtext;
  button.textContent = buttonText;
  button.classList.add("disabled");
  button.removeAttribute("href");
  small.innerHTML = smallText;
  error.textContent = errorText;
}

const supportText = `
  Think this is wrong? Contact
  <a href="https://x.com/skylarksupport" target="_blank">@SkylarkSupport</a>.
`;

if (!isApple) {
  unsupported(
    "Unsupported Device",
    "Skylark is designed for Apple devices",
    "Use an iPhone, iPad, or supported Apple device to upgrade.",
    "Unavailable",
    supportText,
    "Android, Windows, and Linux devices are not supported."
  );

  throw new Error("Unsupported device");
}

if (!ios) {
  unsupported(
    "Version Not Detected",
    "Skylark could not read your iOS version",
    "Your device may be using an unsupported or unusual browser.",
    "Unavailable",
    supportText,
    "Open this page in Safari on your Apple device."
  );

  throw new Error("Unknown iOS");
}

if (ios < 14.3) {
  unsupported(
    "Upgrade Unavailable",
    "Your iOS version is too old for Skylark",
    `Detected iOS ${ios}`,
    "Unavailable",
    supportText,
    "iOS 14.3 or newer is required."
  );

  throw new Error("Too old");
}

let found = null;

for (const item of editions) {
  if (ios >= item.min && ios <= item.max) {
    found = item;
  }
}

if (!found) {
  unsupported(
    "Not Yet Available",
    "A Skylark edition for this iOS version is not available yet",
    `Detected iOS ${ios}`,
    "Unavailable",
    `
      Skylark may not have an edition for your current version yet.<br><br>
      Contact <a href="https://x.com/skylarksupport" target="_blank">@SkylarkSupport</a>
      if you believe this is an issue.
    `,
    "A compatible Skylark edition has not been released yet."
  );

  throw new Error("Unsupported iOS version");
}

badge.textContent = "Recommended Edition";
title.textContent = `Upgrade to Skylark ${found.edition}`;
version.textContent = `This is the Skylark edition built for iOS ${ios}.`;

button.textContent = `Get ${found.edition}`;
button.href = found.link;

small.innerHTML = `
  Using the right edition keeps Skylark smoother, cleaner, and better matched to your device.<br><br>
  Find more editions at
  <a href="https://endlesspete.github.io/Undecimus/" target="_blank">Undecimus</a>.
`;

console.log("Detected iOS:", ios);
console.log("Recommended Skylark:", found.edition);
</script>

</body>
</html>
